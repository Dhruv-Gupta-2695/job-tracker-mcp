<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Tracker</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/static/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/static/icons/icon-192.png" />
<meta name="theme-color" content="#171a21" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Job Tracker" />
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --border: #2a2f3a; --text: #e6e8ee;
    --muted: #9aa3b2; --accent: #5b8def; --accent-dim: #33507a;
    --green: #4caf7d; --red: #e0685f; --yellow: #d9b34c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 20px 28px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .actions { display: flex; gap: 10px; }
  nav {
    display: flex; gap: 4px; padding: 0 28px; border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none; border: none; color: var(--muted); padding: 12px 16px;
    cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 24px 28px; max-width: 980px; }
  .tab { display: none; }
  .tab.active { display: block; }
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  button.btn {
    background: var(--accent); color: white; border: none; border-radius: 6px;
    padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 500;
  }
  button.btn:hover { background: #4c7bd6; }
  button.btn:disabled { background: var(--accent-dim); cursor: not-allowed; }
  button.btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  textarea, input[type=text] {
    width: 100%; background: #0c0e12; border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  textarea { min-height: 140px; resize: vertical; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .badge { padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.applied { background: #3a3f4a; color: #c8ccd6; }
  .badge.interview { background: #4a4326; color: var(--yellow); }
  .badge.offer { background: #1e3f2c; color: var(--green); }
  .badge.rejected { background: #45252a; color: var(--red); }
  .badge.update { background: #223349; color: #7fa8e0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  .status-msg { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-top: 10px; }
  .status-msg.ok { background: #17301f; color: var(--green); }
  .status-msg.err { background: #3a1e20; color: var(--red); }
  .similar-box { background: #1a2436; border: 1px solid var(--accent-dim); border-radius: 8px; padding: 14px; margin-top: 14px; }
  /* Dashboard + pagination */
  .dash { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
  .donut { width: 170px; height: 170px; flex: none; }
  .donut .num { font-size: 8px; font-weight: 600; fill: var(--text); }
  .donut .sub { font-size: 2.6px; fill: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; flex: 1; min-width: 280px; }
  button.tile {
    background: #0c0e12; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    text-align: left; color: var(--text); cursor: pointer; font: inherit;
  }
  button.tile:hover { border-color: var(--accent-dim); }
  button.tile.active { border-color: var(--accent); background: #1a2436; }
  .tile .num { font-size: 24px; font-weight: 600; line-height: 1.2; }
  .tile .lbl { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; text-transform: capitalize; }
  .tile .pct { font-size: 11px; color: var(--muted); margin-left: auto; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; width: auto; }
  select {
    background: #0c0e12; border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    padding: 9px 10px; font-size: 13px; font-family: inherit;
  }
  .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; gap: 10px; flex-wrap: wrap; }
  .pager .btns { display: flex; gap: 8px; }
  pre.generated { white-space: pre-wrap; font-family: inherit; font-size: 13px; background: #0c0e12; border: 1px solid var(--border); border-radius: 6px; padding: 12px; max-height: 320px; overflow-y: auto; }
</style>
</head>
<body>

<header>
  <h1>Job Tracker</h1>
  <div class="actions">
    <button class="btn secondary" id="scanBtn" style="display:none">Run scan now</button>
    <a class="muted" id="sheetLink" href="#" target="_blank" style="margin-left:8px; align-self:center;">Open Sheet ↗</a>
  </div>
</header>

<nav>
  <button data-tab="applications" class="active">Applications</button>
  <button data-tab="cv">CV Manager</button>
  <button data-tab="generate">Generate</button>
  <button data-tab="history">History</button>
  <button data-tab="prompts">Prompts</button>
</nav>

<main>

  <section class="tab active" id="tab-applications">
    <div class="card">
      <h2>Overview</h2>
      <div class="dash">
        <svg id="donut" class="donut" viewBox="0 0 42 42" role="img" aria-label="Applications by status"></svg>
        <div class="tiles" id="tiles"></div>
      </div>
    </div>
    <div class="card">
      <h2>Applications</h2>
      <div class="toolbar">
        <input type="text" id="appSearch" placeholder="Search company or position..." />
        <select id="pageSize" aria-label="Rows per page">
          <option value="10">10 per page</option>
          <option value="25" selected>25 per page</option>
          <option value="50">50 per page</option>
          <option value="100">100 per page</option>
        </select>
      </div>
      <table id="appsTable">
        <thead><tr><th>Company</th><th>Position</th><th>Status</th><th>Applied</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="pager">
        <span class="muted" id="pageInfo"></span>
        <div class="btns">
          <button class="btn secondary" id="prevPage">&larr; Prev</button>
          <button class="btn secondary" id="nextPage">Next &rarr;</button>
        </div>
      </div>
    </div>
  </section>

  <section class="tab" id="tab-cv">
    <div class="card">
      <h2>Core CV</h2>
      <p class="muted" id="cvStatus">Loading...</p>
      <label>Paste CV text (or upload a file below)</label>
      <textarea id="cvText" placeholder="Paste your CV as plain text..."></textarea>
      <div class="row" style="margin-top:10px;">
        <input type="file" id="cvFile" accept=".pdf,.docx,.txt,.md" />
        <button class="btn" id="saveCvBtn">Save core CV</button>
      </div>
      <div id="cvSaveMsg"></div>
    </div>
  </section>

  <section class="tab" id="tab-generate">
    <div class="card">
      <h2>Generate tailored CV + cover letter</h2>
      <div class="row">
        <div><label>Company</label><input type="text" id="genCompany" /></div>
        <div><label>Position</label><input type="text" id="genPosition" /></div>
      </div>
      <label>Job description</label>
      <textarea id="genJd" placeholder="Paste the full job description..."></textarea>
      <div class="row" style="margin-top:12px;">
        <button class="btn" id="genBtn">Generate</button>
      </div>
      <div id="genResult"></div>
    </div>
  </section>

  <section class="tab" id="tab-history">
    <div class="card">
      <h2>Generated history</h2>
      <table id="historyTable">
        <thead><tr><th>Created</th><th>Company</th><th>Position</th><th>CV</th><th>Cover letter</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="tab" id="tab-prompts">
    <div class="card">
      <h2>CV tailoring prompt</h2>
      <textarea id="promptCvTailor"></textarea>
      <button class="btn" style="margin-top:10px;" onclick="savePrompt('cv_tailor', 'promptCvTailor')">Save</button>
      <div id="promptCvMsg"></div>
    </div>
    <div class="card">
      <h2>Cover letter prompt</h2>
      <textarea id="promptCoverLetter"></textarea>
      <button class="btn" style="margin-top:10px;" onclick="savePrompt('cover_letter', 'promptCoverLetter')">Save</button>
      <div id="promptClMsg"></div>
    </div>
  </section>

</main>

<script>
const api = (path, opts) => fetch(path, opts).then(async r => {
  if (!r.ok) { const body = await r.json().catch(() => ({})); throw new Error(body.detail || r.statusText); }
  return r.json();
});

// --- Tabs ---
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'history') loadHistory();
    if (btn.dataset.tab === 'prompts') loadPrompts();
  });
});

// --- Applications ---
// Company / position text comes from email subjects and bodies, so it must
// never be dropped into the page as raw HTML.
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : '');

const STATUS_ORDER = ['applied', 'interview', 'offer', 'rejected', 'update'];
const STATUS_COLORS = {
  applied: '#6b7385', interview: '#d9b34c', offer: '#4caf7d', rejected: '#e0685f', update: '#7fa8e0',
};
const FALLBACK_COLOR = '#a78bda';
const statusKey = s => (s || 'applied').toString().trim().toLowerCase() || 'applied';
const statusColor = s => STATUS_COLORS[s] || FALLBACK_COLOR;

function badge(status) {
  const s = statusKey(status);
  return `<span class="badge ${esc(s)}">${esc(s)}</span>`;
}

// ---- Pure helpers (no DOM) ----
function countByStatus(apps) {
  const counts = {};
  apps.forEach(a => { const k = statusKey(a.Status); counts[k] = (counts[k] || 0) + 1; });
  return counts;
}

function orderedStatuses(counts) {
  const extra = Object.keys(counts).filter(k => !STATUS_ORDER.includes(k)).sort();
  return STATUS_ORDER.filter(k => counts[k]).concat(extra);
}

function filterApps(apps, status, query) {
  const q = (query || '').trim().toLowerCase();
  return apps.filter(a =>
    (status === 'all' || statusKey(a.Status) === status) &&
    (!q || `${a.Company || ''} ${a.Position || ''}`.toLowerCase().includes(q)));
}

function paginate(items, page, pageSize) {
  const total = items.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  const p = Math.min(Math.max(1, page), totalPages);
  const startIdx = (p - 1) * pageSize;
  return {
    items: items.slice(startIdx, startIdx + pageSize), page: p, totalPages, total,
    from: total ? startIdx + 1 : 0, to: Math.min(startIdx + pageSize, total),
  };
}

// Donut as stacked stroke-dasharray circles (circumference scaled to 100).
function donutSegments(counts) {
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  let acc = 0;
  return orderedStatuses(counts).map(status => {
    const pct = total ? (counts[status] / total) * 100 : 0;
    const seg = { status, count: counts[status], pct, offset: 25 - acc };
    acc += pct;
    return seg;
  });
}

// ---- Rendering ----
const view = { page: 1, pageSize: 25, status: 'all', query: '' };
let allApps = [];

function renderDashboard() {
  const counts = countByStatus(allApps);
  const total = allApps.length;

  const segs = donutSegments(counts).map(s =>
    `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${statusColor(s.status)}" stroke-width="5"
       stroke-dasharray="${s.pct.toFixed(3)} ${(100 - s.pct).toFixed(3)}" stroke-dashoffset="${s.offset.toFixed(3)}">
       <title>${esc(s.status)}: ${s.count} (${s.pct.toFixed(0)}%)</title></circle>`).join('');
  document.getElementById('donut').innerHTML =
    `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="#2a2f3a" stroke-width="5"/>${segs}
     <text x="21" y="22.5" text-anchor="middle" class="num">${total}</text>
     <text x="21" y="27" text-anchor="middle" class="sub">${total === 1 ? 'application' : 'applications'}</text>`;

  const tile = (key, label, count, color) => `
    <button class="tile${view.status === key ? ' active' : ''}" data-status="${esc(key)}">
      <div class="num">${count}</div>
      <div class="lbl"><span class="dot" style="background:${color}"></span>${esc(label)}
        ${key !== 'all' && total ? `<span class="pct">${Math.round((count / total) * 100)}%</span>` : ''}</div>
    </button>`;
  const statuses = orderedStatuses(counts);
  // Always show the four headline statuses, even at 0, so the layout is stable.
  const shown = ['applied', 'interview', 'offer', 'rejected'].concat(statuses.filter(s => !['applied', 'interview', 'offer', 'rejected'].includes(s)));
  document.getElementById('tiles').innerHTML =
    tile('all', 'total', total, '#e6e8ee') + shown.map(s => tile(s, s, counts[s] || 0, statusColor(s))).join('');
  document.querySelectorAll('#tiles .tile').forEach(btn => btn.addEventListener('click', () => {
    view.status = (view.status === btn.dataset.status) ? 'all' : btn.dataset.status;
    view.page = 1;
    renderDashboard(); renderTable();
  }));
}

function renderTable() {
  const filtered = filterApps(allApps, view.status, view.query);
  const pg = paginate(filtered, view.page, view.pageSize);
  view.page = pg.page;

  document.querySelector('#appsTable tbody').innerHTML = pg.items.map(a => {
    const link = safeUrl(a['Gmail Link']);
    return `
    <tr>
      <td>${esc(a.Company)}</td>
      <td>${esc(a.Position)}</td>
      <td>${badge(a.Status)}</td>
      <td>${esc(a['Applied Date'])}</td>
      <td>${link ? `<a href="${esc(link)}" target="_blank" rel="noopener">email ↗</a>` : ''}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="5" class="muted">${
    allApps.length ? 'No applications match your filter.' : 'No applications tracked yet.'}</td></tr>`;

  const filterNote = view.status !== 'all' ? ` · filtered by "${esc(view.status)}"` : '';
  document.getElementById('pageInfo').innerHTML = pg.total
    ? `Showing ${pg.from}–${pg.to} of ${pg.total} · Page ${pg.page} of ${pg.totalPages}${filterNote}`
    : `0 results${filterNote}`;
  document.getElementById('prevPage').disabled = pg.page <= 1;
  document.getElementById('nextPage').disabled = pg.page >= pg.totalPages;
}

document.getElementById('prevPage').addEventListener('click', () => { view.page--; renderTable(); });
document.getElementById('nextPage').addEventListener('click', () => { view.page++; renderTable(); });
document.getElementById('pageSize').addEventListener('change', e => {
  view.pageSize = parseInt(e.target.value, 10) || 25; view.page = 1; renderTable();
});
document.getElementById('appSearch').addEventListener('input', e => {
  view.query = e.target.value; view.page = 1; renderTable();
});

async function loadApplications() {
  const data = await api('/api/applications');
  document.getElementById('sheetLink').href = data.sheet_url || '#';
  allApps = (data.applications || []).slice().reverse();  // newest first
  renderDashboard();
  renderTable();
}

// --- CV Manager ---
async function loadCv() {
  const data = await api('/api/cv');
  document.getElementById('cvStatus').textContent = data.has_cv
    ? 'A core CV is saved. Paste new text or upload a file below to replace it.'
    : 'No core CV uploaded yet.';
  if (data.text) document.getElementById('cvText').value = data.text;
}

document.getElementById('saveCvBtn').addEventListener('click', async () => {
  const msg = document.getElementById('cvSaveMsg');
  const file = document.getElementById('cvFile').files[0];
  const text = document.getElementById('cvText').value;
  const form = new FormData();
  if (file) form.append('file', file);
  else if (text.trim()) form.append('text', text);
  else { msg.innerHTML = '<div class="status-msg err">Paste CV text or choose a file first.</div>'; return; }

  try {
    const data = await api('/api/cv', { method: 'POST', body: form });
    document.getElementById('cvText').value = data.text;
    msg.innerHTML = '<div class="status-msg ok">Core CV saved.</div>';
    loadCv();
  } catch (e) {
    msg.innerHTML = `<div class="status-msg err">${e.message}</div>`;
  }
});

// --- Generate ---
document.getElementById('genBtn').addEventListener('click', () => doGenerate(false));

async function doGenerate(forceNew) {
  const result = document.getElementById('genResult');
  const company = document.getElementById('genCompany').value;
  const position = document.getElementById('genPosition').value;
  const job_description = document.getElementById('genJd').value;
  if (!company || !position || !job_description.trim()) {
    result.innerHTML = '<div class="status-msg err">Fill in company, position, and job description.</div>';
    return;
  }
  result.innerHTML = '<p class="muted">Generating...</p>';
  try {
    const data = await api('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ company, position, job_description, force_new: forceNew }),
    });
    if (data.similar_match) {
      const m = data.similar_match;
      result.innerHTML = `
        <div class="similar-box">
          <strong>This looks similar to an earlier application</strong>
          <p class="muted">${m.company} — ${m.position} (${Math.round(m.score * 100)}% similar)</p>
          <p>
            <a href="${m.cv_link}" target="_blank">View that CV ↗</a> ·
            <a href="${m.cover_letter_link}" target="_blank">View that cover letter ↗</a>
          </p>
          <button class="btn secondary" onclick="doGenerate(true)">Generate a fresh one anyway</button>
        </div>`;
      return;
    }
    const g = data.generated;
    result.innerHTML = `
      <div class="status-msg ok">Generated. Saved to Drive and added to History.</div>
      <label>Tailored CV</label>
      <pre class="generated">${g.cv_text}</pre>
      <p><a href="/api/download/${g.cv_file_id}" target="_blank">Download CV PDF ↓</a></p>
      <label>Cover letter</label>
      <pre class="generated">${g.cover_letter_text}</pre>
      <p><a href="/api/download/${g.cover_letter_file_id}" target="_blank">Download cover letter PDF ↓</a></p>
    `;
  } catch (e) {
    result.innerHTML = `<div class="status-msg err">${e.message}</div>`;
  }
}

// --- History ---
async function loadHistory() {
  const data = await api('/api/cv-versions');
  const tbody = document.querySelector('#historyTable tbody');
  tbody.innerHTML = (data.versions || []).map(v => `
    <tr>
      <td>${v['Created At']}</td>
      <td>${v.Company}</td>
      <td>${v.Position}</td>
      <td><a href="${v['Tailored CV Drive Link']}" target="_blank">view ↗</a></td>
      <td><a href="${v['Cover Letter Drive Link']}" target="_blank">view ↗</a></td>
    </tr>
  `).join('') || '<tr><td colspan="5" class="muted">Nothing generated yet.</td></tr>';
}

// --- Prompts ---
async function loadPrompts() {
  const data = await api('/api/prompts');
  document.getElementById('promptCvTailor').value = data.prompts.cv_tailor || '';
  document.getElementById('promptCoverLetter').value = data.prompts.cover_letter || '';
}

async function savePrompt(name, textareaId) {
  const msgId = name === 'cv_tailor' ? 'promptCvMsg' : 'promptClMsg';
  const msg = document.getElementById(msgId);
  try {
    await api('/api/prompts', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, template: document.getElementById(textareaId).value }),
    });
    msg.innerHTML = '<div class="status-msg ok">Saved.</div>';
  } catch (e) {
    msg.innerHTML = `<div class="status-msg err">${e.message}</div>`;
  }
}

// --- Manual scan trigger ---
async function initScanButton() {
  const data = await api('/api/config');
  if (!data.can_trigger_scan) return;
  const btn = document.getElementById('scanBtn');
  btn.style.display = 'inline-block';
  btn.addEventListener('click', async () => {
    btn.disabled = true; btn.textContent = 'Triggering...';
    try {
      await api('/api/trigger-scan', { method: 'POST' });
      btn.textContent = 'Scan triggered ✓';
    } catch (e) {
      btn.textContent = 'Run scan now';
      alert(e.message);
    } finally {
      btn.disabled = false;
      setTimeout(() => { btn.textContent = 'Run scan now'; }, 4000);
    }
  });
}

loadApplications();
loadCv();
initScanButton();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch((err) => {
      console.warn("Service worker registration failed (app still works fine without it):", err);
    });
  });
}
</script>

</body>
</html>
