# Runs NextStep behind Caddy (automatic https) on one small server.
# Usage (on the server, from the repo folder):
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  nextstep:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    mem_limit: 600m          # keeps one app from starving the others
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/manifest.json')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - NEXTSTEP_DOMAIN=${NEXTSTEP_DOMAIN}
    depends_on:
      - nextstep
    mem_limit: 100m

volumes:
  caddy_data:
  caddy_config:
