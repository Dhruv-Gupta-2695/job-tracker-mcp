# Runs NextStep behind Caddy (automatic https) on one small server.
# Usage (on the server, from the repo folder):
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
services:
  nextstep:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - nextstep_data:/data   # join counter (joins.json)
    mem_limit: 600m          # keeps one app from starving the others
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/manifest.json')"]
      interval: 30s
      timeout: 5s
      retries: 3

  marketanalyst:
    # Streamlit UI only. The heavy FastAPI backend stays on Render (BACKEND_URL below).
    # Built straight from the public market_analyst repo; the image installs just what the UI needs.
    build:
      context: https://github.com/Dhruv-Gupta-2695/market_analyst.git#main
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONUNBUFFERED=1
        WORKDIR /app
        RUN pip install --no-cache-dir streamlit pandas httpx pydantic-settings
        COPY backend/app ./backend/app
        COPY frontend ./frontend
        RUN useradd --create-home app && chown -R app /app
        USER app
        EXPOSE 8501
        CMD ["streamlit", "run", "frontend/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true", "--browser.gatherUsageStats=false"]
    restart: unless-stopped
    environment:
      - BACKEND_URL=${MARKET_BACKEND_URL}
    expose:
      - "8501"
    mem_limit: 350m

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - NEXTSTEP_DOMAIN=${NEXTSTEP_DOMAIN}
      - MARKET_DOMAIN=${MARKET_DOMAIN}
    depends_on:
      - nextstep
      - marketanalyst
    mem_limit: 100m

volumes:
  nextstep_data:
  caddy_data:
  caddy_config:
