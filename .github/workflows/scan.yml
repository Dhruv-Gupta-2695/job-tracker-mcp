name: Job Tracker Scan

on:
  # No `schedule:` here on purpose. Runs are triggered on time by cron-job.org
  # (12:00 and 19:00 IST, calling the workflow_dispatch API), with a backup
  # call to the webapp's /api/trigger-scan. GitHub's own cron is best-effort
  # (late or skipped runs, and it would double up with the external trigger).
  # To go back to GitHub's scheduler, re-add:
  #   schedule:
  #     - cron: "30 6 * * *"   # 12:00 IST
  #     - cron: "30 13 * * *"  # 19:00 IST
  workflow_dispatch: {}  # manual runs from the Actions tab, the webapp button, and cron-job.org

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show exact commit being run (diagnostic)
        run: |
          echo "Running commit: $GITHUB_SHA"
          git log -1 --oneline
          grep -n "fromtimestamp\|fromisoformat" src/tracker.py || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials from secrets
        run: |
          echo "$GMAIL_CREDENTIALS_JSON" > credentials.json
          echo "$GMAIL_TOKEN_JSON" > token.json
        env:
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}

      - name: Run scan
        run: python3 run_once.py
        env:
          GMAIL_CREDENTIALS_PATH: ./credentials.json
          GMAIL_TOKEN_PATH: ./token.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
